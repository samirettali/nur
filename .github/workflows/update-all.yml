name: Update all packages

on:
  workflow_dispatch:
  schedule:
    - cron: '40 15 * * *'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: update-all
  cancel-in-progress: false

jobs:
  update-all:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PR_AUTOMATION_TOKEN || github.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create update workspace
        run: |
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -B automated/update-all-workspace "origin/${DEFAULT_BRANCH}"

      - name: Run update-all
        env:
          UPDATE_RESULTS_DIR: ${{ runner.temp }}/update-results
        run: NIX_PATH=nixpkgs=channel:nixpkgs-unstable ./update-all.sh

      - name: Sync updater failure issues
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN || github.token }}
          UPDATE_RESULTS_DIR: ${{ runner.temp }}/update-results
        run: |
          shopt -s nullglob
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          for status_file in "${UPDATE_RESULTS_DIR}"/*.status; do
            pkg=$(basename "${status_file}" .status)
            status=$(<"${status_file}")
            title="chore(${pkg}): fix failed automatic update"
            issue_number=$(gh issue list \
              --state open \
              --limit 100 \
              --json number,title \
              | jq -r --arg title "${title}" ".[] | select(.title == \$title) | .number" \
              | head -n1)

            if [ "${status}" = failure ]; then
              body_file=$(mktemp)
              {
                printf 'The automatic updater for **%s** failed.\n\n' "${pkg}"
                printf 'Run: [%s](%s)\n\n' "${GITHUB_RUN_ID}" "${run_url}"
                printf '<!-- automatic-update-failure:%s -->\n' "${pkg}"
                if [ -f "${UPDATE_RESULTS_DIR}/${pkg}.log" ]; then
                  printf '\n<details><summary>Updater output</summary>\n\n```text\n'
                  cat "${UPDATE_RESULTS_DIR}/${pkg}.log"
                  printf '\n```\n\n</details>\n'
                fi
              } >"${body_file}"

              if [ -n "${issue_number}" ]; then
                gh issue comment "${issue_number}" --body-file "${body_file}"
              else
                gh issue create \
                  --title "${title}" \
                  --body-file "${body_file}" \
                  --assignee "${GITHUB_REPOSITORY_OWNER}"
              fi

              rm -f "${body_file}"
            elif [ -n "${issue_number}" ]; then
              gh issue close "${issue_number}" \
                --reason completed \
                --comment "The updater completed successfully in [run ${GITHUB_RUN_ID}](${run_url}). Closing automatically."
            fi
          done

      - name: Check for new commits
        id: changes
        run: |
          commit_count=$(git rev-list --count "origin/${DEFAULT_BRANCH}..HEAD")
          echo "commit_count=${commit_count}" >> "$GITHUB_OUTPUT"

      - name: Create or update pull requests
        if: steps.changes.outputs.commit_count != '0'
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN || github.token }}
        run: |
          mapfile -t commits < <(git rev-list --reverse "origin/${DEFAULT_BRANCH}..HEAD")

          for commit in "${commits[@]}"; do
            subject=$(git log -1 --format=%s "$commit")
            pkg=${subject%%:*}

            if [ -z "${pkg}" ] || [ "${pkg}" = "${subject}" ]; then
              pkg="commit-${commit:0:7}"
            fi

            branch_pkg=$(printf '%s' "${pkg}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')
            update_branch="automated/update-${branch_pkg}"

            git checkout -B "${update_branch}" "origin/${DEFAULT_BRANCH}"
            git cherry-pick "$commit"
            git push --force-with-lease origin "HEAD:${update_branch}"

            pr_title="$subject"

            pr_body_file=$(mktemp)
            ./.github/scripts/build-pr-body.sh "$commit" > "${pr_body_file}"

            pr_number=$(gh pr list \
              --head "${update_branch}" \
              --base "${DEFAULT_BRANCH}" \
              --json number \
              --jq '.[0].number')

            if [ -n "${pr_number}" ]; then
              gh pr edit "${pr_number}" \
                --title "${pr_title}" \
                --body-file "${pr_body_file}"
            else
              gh pr create \
                --base "${DEFAULT_BRANCH}" \
                --head "${update_branch}" \
                --title "${pr_title}" \
                --body-file "${pr_body_file}"
            fi

            rm -f "${pr_body_file}"
          done

      - name: No changes
        if: steps.changes.outputs.commit_count == '0'
        run: echo 'No package updates found.'
